name: Pruebas de navegador real

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtener el codigo del PR
        uses: actions/checkout@v4
      - name: Usar Node.js 22 (sin paquetes npm)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ejecutar pruebas en Chrome
        shell: bash
        run: |
          command -v google-chrome || command -v chromium
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/dimsac-test-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node scripts/browser-check.mjs
